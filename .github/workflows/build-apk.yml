name: Build Ghaith APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'ghaith-altasmeemat-github.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - name: Extract and Find Project Root
        run: |
          mkdir -p extracted
          unzip -o ghaith-altasmeemat-github.zip -d extracted
          PACKAGE_DIR=$(find extracted -name package.json -not -path "*/node_modules/*" -not -path "*/functions/*" | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2- | xargs dirname)
          if [ -z "$PACKAGE_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "Project: $PACKAGE_DIR"
          echo "PROJECT_DIR=$PACKAGE_DIR" >> $GITHUB_ENV

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Web App (Vite)
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaith-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
