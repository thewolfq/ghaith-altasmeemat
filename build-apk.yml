name: Build Ghaith APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'ghaith-altasmeemat-github.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o ghaith-altasmeemat-github.zip -d extracted
          # التأكد من وجود ملف package.json
          if [ ! -f extracted/package.json ]; then
            echo "خطأ: لم يتم العثور على package.json داخل ملف الـ ZIP."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'extracted/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./extracted

      - name: Build Web App (Vite)
        run: npm run build
        working-directory: ./extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ./extracted

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ./extracted

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghaith-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
